<!DOCTYPE html>

	<head>
    <!-- FFC Consent Mode v2 defaults — every storage type that carries
         measurement or personalisation is DENIED for every visitor,
         worldwide: analytics_storage, ad_storage, ad_user_data,
         ad_personalization and personalization_storage. The list is written
         out rather than summarised as "analytics and advertising" because a
         signal left unspecified defaults to GRANTED, and
         personalization_storage is neither — a summary in those terms has a
         hole in it exactly the size of that signal and still reads as
         complete. functionality_storage and security_storage stay granted
         below: neither carries measurement, and with no banner on this site
         nothing ever changes either of them.
         MUST execute before any Google tag, which is why it sits at the top
         of <head>. This site has no consent banner, so nothing can lift the
         denial — analytics runs cookieless until the site moves onto the FFC
         template, which brings a banner with it. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        'ad_storage': 'denied',
        'ad_user_data': 'denied',
        'ad_personalization': 'denied',
        'analytics_storage': 'denied',
        'functionality_storage': 'granted',
        'personalization_storage': 'denied',
        'security_storage': 'granted'
      });
      gtag('set', 'url_passthrough', true);
      gtag('set', 'ads_data_redaction', true);
    </script>

        j.async = true

        f.parentNode.insertBefore(j, f)
      })(window, document, 'script', 'dataLayer', 'GTM-PJSD8G26')
    </script>
