<!DOCTYPE html>
<html>
	<head>
    <!-- FFC Consent Mode v2 defaults. Every storage type that carries
         measurement or personalisation is DENIED by default:
         analytics_storage, ad_storage, ad_user_data, ad_personalization
         and personalization_storage. The list is written out rather than
         summarised as "analytics and advertising" because a signal left
         unspecified defaults to GRANTED, and personalization_storage is
         neither: a summary in those terms has a hole in it exactly the
         size of that signal and still reads as complete.
         functionality_storage and security_storage stay granted: neither
         carries measurement, and with no consent banner on this site
         nothing ever changes either of them. Analytics runs cookieless
         until the site moves onto the FFC template, which brings a banner
         with it.

         Scope, stated exactly. This governs visitors whose browser runs
         this script. A visitor with JavaScript disabled never executes it,
         and the GTM noscript iframe below still loads for them, so the
         denial does not reach that path. Saying "every visitor" would be
         the same shape of over-claim that writing the signal list out is
         meant to prevent.

         This comment is ASCII-only on purpose. It sits ahead of the
         page's meta charset declaration, so its bytes are parsed before
         the document states its encoding. That is a statement about this
         comment and nothing else: the surrounding pre-charset region is
         NOT clean -- neighbouring comments on these pages carry em dashes
         and emoji, and the charset declaration itself sits past the
         1024-byte window the spec allows it. Both predate this work and
         are tracked separately. Keeping this block ASCII simply stops it
         adding to the problem.

         MUST execute before any Google tag, which is why it sits at the
         top of head. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        'ad_storage': 'denied',
        'ad_user_data': 'denied',
        'ad_personalization': 'denied',
        'analytics_storage': 'denied',
        'functionality_storage': 'granted',
        'personalization_storage': 'denied',
        'security_storage': 'granted'
      });
      gtag('set', 'url_passthrough', true);
      gtag('set', 'ads_data_redaction', true);
    </script>

    <!-- Google Tag Manager -->
    <script>
      ;(function (w, d, s, l, i) {
        w[l] = w[l] || []
        w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' })
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s),
          dl = l != 'dataLayer' ? '&l=' + l : ''
        j.async = true
        j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + dl
        f.parentNode.insertBefore(j, f)
      })(window, document, 'script', 'dataLayer', 'GTM-PJSD8G26')
    </script>
    <!-- End Google Tag Manager -->
